<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    .full-width-svg {
      display: block;
      width: 100%;
      max-width: none; 
      height: auto; 
    }
  </style>
</head>
<body>
  <img src="sitzplan.svg" alt="Graphic" class="full-width-svg">
</body>
</html>
