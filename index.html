<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      overflow-x: hidden; 
    }

    .svg-container {
      width: 100%; 
      max-width: 1200px; 
      margin: 0 auto; 
    }

    .svg-container img {
      display: block;
      width: 100%;
      height: auto; 
      max-height: none;
    }
  </style>
</head>
<body>

  <div class="svg-container">
    <img src="sitzplan.svg" alt="Graphic">
  </div>

</body>
</html>
